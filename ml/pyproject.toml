[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clincode_ml"
version = "0.1.0"
description = "ClinCode ML and Evaluation Package"
authors = [{ name = "ClinCode Team" }]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "datasets>=2.18.0",
    "scikit-learn>=1.4.1",
    "onnxruntime>=1.17.1",
    "qdrant-client>=1.8.0",
    "mlflow>=2.11.0",
    "dvc>=3.48.0",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "pydantic>=2.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1"
]

[tool.setuptools.packages.find]
where = ["src"]
